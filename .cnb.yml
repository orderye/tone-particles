main:
  push:
    # 缺省镜像 cnbcool/default-build-env（Debian 13）不含 python3，
    # 不显式指定镜像时所有 stage 都会以 127 退出。
    - docker:
        image: python:3.12-slim
      stages:
        - name: setup
          script: python3 --version
        - name: 自检（配置、风格一致性、CLI、单元测试）
          script: python3 tools/selfcheck.py
        - name: 评测（确定性指标）
          script: python3 eval/run.py --out eval/report.md
