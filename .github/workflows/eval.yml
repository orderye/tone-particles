name: eval

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自检（配置、风格一致性、CLI、单元测试）
        run: python3 tools/selfcheck.py

      - name: 评测（确定性指标）
        run: python3 eval/run.py --out eval/report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.*
          if-no-files-found: ignore
